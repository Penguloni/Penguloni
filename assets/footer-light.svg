<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="860" height="56" viewBox="0 0 860 56" role="img" aria-label="16 agents and one human"><title>16 agents and one human</title><style><![CDATA[
@keyframes fu{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fi{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
@keyframes sweep{from{transform:scaleX(0)}to{transform:none}}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
.fu{animation:fu .6s cubic-bezier(.22,.7,.2,1) both}
.fi{animation:fi .6s cubic-bezier(.22,.7,.2,1) both}
.pop{animation:pop .5s cubic-bezier(.34,1.56,.64,1) both;transform-box:fill-box;transform-origin:center}
.sweep{animation:sweep .6s cubic-bezier(.22,.7,.2,1) both;transform-box:fill-box;transform-origin:left center}
.draw{stroke-dasharray:1;animation:draw .9s cubic-bezier(.22,.7,.2,1) both}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
@keyframes bob{0%,40%,100%{transform:translateY(0)}20%{transform:translateY(-9px)}}.bob{animation:bob 3s cubic-bezier(.22,.7,.2,1) infinite}]]></style><defs></defs><g class="bob" style="animation-delay:0s"><circle cx="238" cy="32" r="4.5" fill="#6F7B98"/></g><g class="bob" style="animation-delay:0.07s"><circle cx="262" cy="32" r="4.5" fill="#6F7B98"/></g><g class="bob" style="animation-delay:0.14s"><circle cx="286" cy="32" r="4.5" fill="#6F7B98"/></g><g class="bob" style="animation-delay:0.21s"><circle cx="310" cy="32" r="4.5" fill="#6F7B98"/></g><g class="bob" style="animation-delay:0.28s"><circle cx="334" cy="32" r="4.5" fill="#6F7B98"/></g><g class="bob" style="animation-delay:0.35s"><circle cx="358" cy="32" r="4.5" fill="#6F7B98"/></g><g class="bob" style="animation-delay:0.42s"><circle cx="382" cy="32" r="4.5" fill="#6F7B98"/></g><g class="bob" style="animation-delay:0.49s"><circle cx="406" cy="32" r="4.5" fill="#6F7B98"/></g><g class="bob" style="animation-delay:0.56s"><circle cx="430" cy="32" r="4.5" fill="#6F7B98"/></g><g class="bob" style="animation-delay:0.63s"><circle cx="454" cy="32" r="4.5" fill="#6F7B98"/></g><g class="bob" style="animation-delay:0.7s"><circle cx="478" cy="32" r="4.5" fill="#6F7B98"/></g><g class="bob" style="animation-delay:0.77s"><circle cx="502" cy="32" r="4.5" fill="#6F7B98"/></g><g class="bob" style="animation-delay:0.84s"><circle cx="526" cy="32" r="4.5" fill="#6F7B98"/></g><g class="bob" style="animation-delay:0.91s"><circle cx="550" cy="32" r="4.5" fill="#6F7B98"/></g><g class="bob" style="animation-delay:0.98s"><circle cx="574" cy="32" r="4.5" fill="#6F7B98"/></g><g class="bob" style="animation-delay:1.05s"><circle cx="598" cy="32" r="4.5" fill="#6F7B98"/></g><g class="bob" style="animation-delay:1.12s"><circle cx="622" cy="32" r="6" fill="#E39A72"/></g></svg>